<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 24" width="80" height="24" role="img" aria-label="Live status">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background pill -->
  <rect width="80" height="24" rx="12" fill="#052e16" opacity="0.85"/>
  <!-- Pulsing ring -->
  <circle cx="16" cy="12" r="7" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.4">
    <animate attributeName="r" values="7;11;7" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Solid dot -->
  <circle cx="16" cy="12" r="5" fill="#22c55e" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- "Live" label -->
  <text x="29" y="16" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#22c55e" letter-spacing="0.3">Live</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="1200" height="12" role="presentation">
  <defs>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="20%" stop-color="#2563eb" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#2563eb" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <!-- Sweep shimmer gradient -->
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0">
        <animate attributeName="offset" values="-0.5;1.2" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="10%" stop-color="white" stop-opacity="0.7">
        <animate attributeName="offset" values="-0.4;1.3" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="20%" stop-color="white" stop-opacity="0">
        <animate attributeName="offset" values="-0.3;1.4" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <!-- Base line -->
  <rect x="0" y="5" width="1200" height="2" rx="1" fill="url(#line-grad)"/>
  <!-- Sweep shimmer overlay -->
  <rect x="0" y="5" width="1200" height="2" rx="1" fill="url(#sweep)" opacity="0.6"/>
  <!-- Center dot -->
  <circle cx="600" cy="6" r="3" fill="#3b82f6" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8;0.5;0.8" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;3.5;3;2.5;3" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>